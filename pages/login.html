<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Экзаметрика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h2>Авторизация</h2>

    <form class="auth-form" id="loginForm" novalidate>
      <div class="auth-error" id="loginError"></div>

      <div class="form-group">
        <label for="loginEmail">Введите ваш email</label>
        <input type="email" id="loginEmail" placeholder="example@mail.ru" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="loginPassword">Введите ваш пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-auth" id="loginSubmit">Войти в систему</button>
    </form>

    <button class="auth-switch" onclick="window.location.href='register.html'">
      Зарегистрироваться
    </button>
  </div>
</div>

<script src="../scripts/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmit');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }
    function clearError() {
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
    }

    // Если уже залогинен — на dashboard
    if (typeof getCurrentUser === 'function') {
      getCurrentUser()
        .then(() => { window.location.href = 'dashboard.html'; })
        .catch(() => { /* не залогинен — ок */ });
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        showError('Пожалуйста, заполните все поля.');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        showError('Введите корректный email.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Вход...';

      try {
        const result = await login(email, password);

        if (result && result.token) {
          document.cookie = `session_token=${result.token}; path=/; max-age=86400`;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Ошибка входа. Проверьте email и пароль.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти в систему';
      }
    });
  });
</script>

</body>
</html>
