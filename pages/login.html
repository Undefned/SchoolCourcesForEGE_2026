<!-- =========================== FILE: login.html =========================== -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Экзаметрика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/style.css">

</head>
<body>

<!-- =========================== LOGIN PAGE =========================== -->
<div class="auth-page">
  <div class="auth-card">
    <h2>Авторизация</h2>

    <form class="auth-form" id="loginForm">
      <div class="auth-error" id="loginError"></div>

      <div class="form-group">
        <label for="loginEmail">Введите ваш email</label>
        <input type="email" id="loginEmail" placeholder="example@mail.ru" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="loginPassword">Введите ваш пароль</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-auth" id="loginSubmit">Войти в систему</button>
    </form>

    <button class="auth-switch" onclick="window.location.href='register.html'">
      Зарегистрироваться
    </button>
  </div>
</div>

<!-- =========================== SCRIPT =========================== -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmit');

    const token = document.cookie
      .split('; ')
      .find(row => row.startsWith('session_token='))
      ?.split('=')[1];

    if (token) {
      fetch('/api/auth/me', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          window.location.href = 'dashboard.html';
        }
      })
      .catch(() => {});
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      errorEl.classList.remove('visible');
      errorEl.textContent = '';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        errorEl.textContent = 'Пожалуйста, заполните все поля.';
        errorEl.classList.add('visible');
        return;
      }

      if (!email.includes('@') || !email.includes('.')) {
        errorEl.textContent = 'Пожалуйста, введите корректный email.';
        errorEl.classList.add('visible');
        return;
      }

      submitBtn.textContent = 'Вход...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            password: password,
          }),
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error?.message || 'Ошибка входа');
        }

        if (data.data?.token) {
          document.cookie = `session_token=${data.data.token}; path=/; max-age=86400`;
        }

        window.location.href = 'dashboard.html';

      } catch (error) {
        errorEl.textContent = error.message || 'Ошибка при входе. Проверьте email и пароль.';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.textContent = 'Войти в систему';
        submitBtn.disabled = false;
      }
    });
  });
</script>

</body>
</html>
